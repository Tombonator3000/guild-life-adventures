name: Phase 13 raw guest action scan

on:
  push:
    branches:
      - agent/audit-phase13-raw-guest-actions
    paths:
      - phase13-scan-trigger.txt

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase13-raw-guest-actions
          fetch-depth: 1
      - name: Scan current raw action callers
        shell: bash
        run: |
          {
            echo '# Current raw guest action callers'
            echo
            for name in movePlayer spendTime modifyGold modifyHealth modifyHappiness modifyFood modifyClothing modifyMaxHealth modifyRelaxation setJob negotiateRaise cureSickness equipItem unequipItem applyDurabilityLoss; do
              echo "## $name"
              grep -RIn --include='*.ts' --include='*.tsx' -E "\\b${name}\\s*\\(" src | grep -v '/store/helpers/' | grep -v '/test/' | grep -v '\.test\.' || true
              echo
            done
            echo '# Store definitions'
            grep -RIn --include='*.ts' -E '(movePlayer|spendTime|modifyGold|modifyHealth|modifyHappiness|modifyFood|modifyClothing|modifyMaxHealth|modifyRelaxation|setJob|negotiateRaise|cureSickness|equipItem|unequipItem|applyDurabilityLoss):' src/store || true
            echo
            echo '# Current guest allowlist section'
            sed -n '125,225p' src/network/types.ts
          } > phase13-raw-scan.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase13-raw-scan.txt
          git commit -m "Record phase 13 raw action scan"
          git push origin HEAD:agent/audit-phase13-raw-guest-actions
