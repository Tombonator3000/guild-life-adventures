name: Apply phase 6B multiplayer test fix

on:
  push:
    branches:
      - agent/audit-phase6-equipment
    paths:
      - phase6b-test-fix-trigger.txt
      - .github/workflows/apply-phase6b-test-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase6-equipment
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply test patch
        run: node scripts/patch-phase6b-multiplayer-test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/multiplayer.test.ts
          git commit -m "Update equipment multiplayer expectations" || true
          git push origin HEAD:agent/audit-phase6-equipment
