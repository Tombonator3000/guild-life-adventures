name: Apply phase 14A AI semantic services

on:
  push:
    branches:
      - agent/audit-phase14a-ai-services
    paths:
      - phase14a-apply-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase14a-ai-services
          fetch-depth: 1
      - name: Apply AI service migration
        run: node scripts/apply-phase14a-ai-services.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route core AI actions through canonical services"
          git push origin HEAD:agent/audit-phase14a-ai-services
