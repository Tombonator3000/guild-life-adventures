name: Phase 13B focused tests

on:
  push:
    branches:
      - agent/audit-phase13b-travel
    paths:
      - phase13b-focused-trigger.txt

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase13b-travel
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run focused tests and publish output
        shell: bash
        run: |
          set +e
          bunx vitest run src/test/travelService.test.ts src/network/protocolSecurity.test.ts src/test/multiplayer.test.ts > phase13b-focused-result.txt 2>&1
          status=$?
          printf '\nstatus=%s\n' "$status" >> phase13b-focused-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase13b-focused-result.txt
          git commit -m "Record phase 13B focused test result" || true
          git push origin HEAD:agent/audit-phase13b-travel
          exit 0
