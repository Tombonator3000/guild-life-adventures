name: Phase 6 targeted appliance tests

on:
  push:
    branches:
      - agent/audit-phase6-appliances
    paths:
      - phase6-test-trigger.txt
      - .github/workflows/phase6-targeted-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase6-appliances
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run targeted tests and publish output
        shell: bash
        run: |
          set +e
          mkdir -p validation
          bun install --frozen-lockfile > validation/phase6-install.txt 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            bunx vitest run src/test/applianceServices.test.ts > validation/phase6-appliance-tests.txt 2>&1
            test_status=$?
          else
            test_status=99
          fi
          printf 'install=%s\ntests=%s\n' "$install_status" "$test_status" > validation/phase6-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f validation/phase6-*.txt
          git commit -m "Record phase 6 targeted test diagnostics" || true
          git push origin HEAD:agent/audit-phase6-appliances
          exit "$test_status"
