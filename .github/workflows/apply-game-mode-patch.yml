name: Apply game mode patch

on:
  push:
    branches:
      - agent/remaining-audit-phase3
    paths:
      - scripts/apply-game-mode-patch.mjs
      - .github/workflows/apply-game-mode-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remaining-audit-phase3
      - run: node scripts/apply-game-mode-patch.mjs
      - name: Commit patched setup screen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/screens/GameSetup.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add Adventure game mode preset"
          git push origin HEAD:agent/remaining-audit-phase3
