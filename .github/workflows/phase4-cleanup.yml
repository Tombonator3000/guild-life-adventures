name: Clean phase 4 temporary files

on:
  push:
    branches:
      - agent/audit-phase4
    paths:
      - phase4-cleanup-trigger.txt
      - .github/workflows/phase4-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase4
          fetch-depth: 1
      - name: Remove temporary audit machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch \
            .github/workflows/apply-phase4-employment-education.yml \
            .github/workflows/apply-phase4-test-patch.yml \
            .github/workflows/audit-inventory.yml \
            .github/workflows/phase4-self-validate.yml \
            .github/workflows/phase4-cleanup.yml \
            audit-inventory-trigger.txt \
            phase4-employment-education-trigger.txt \
            phase4-test-patch-trigger.txt \
            phase4-validation-trigger.txt \
            phase4-cleanup-trigger.txt \
            phase4-patch-result.txt \
            scripts/apply-phase4-employment-education.mjs \
            scripts/patch-phase4-academy.mjs \
            scripts/patch-phase4-multiplayer-tests.mjs \
            validation/phase4

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove phase 4 temporary audit files"
          git push origin HEAD:agent/audit-phase4
