name: Phase 8 housing scan

on:
  push:
    branches:
      - agent/audit-phase8-housing
    paths:
      - phase8-housing-scan-trigger.txt
      - .github/workflows/phase8-housing-scan.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase8-housing
          fetch-depth: 1
      - name: Scan housing actions
        shell: bash
        run: |
          set +e
          {
            echo '# definitions and callers'
            grep -RIn --include='*.ts' --include='*.tsx' -E '\b(payRent|prepayRent|moveToHousing|begForMoreTime|setHousing)\b' src || true
            echo
            echo '# housing files'
            find src -type f \( -iname '*housing*' -o -iname '*rent*' -o -iname '*landlord*' \) -print | sort
            echo
            echo '# rent fields'
            grep -RIn --include='*.ts' --include='*.tsx' -E 'lockedRent|rentPrepaidWeeks|weeksSinceRent|rentDebt|rentExtensionUsed' src/store src/hooks src/components | head -n 600 || true
          } > phase8-housing-scan.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase8-housing-scan.txt
          git commit -m "Record phase 8 housing scan" || true
          git push origin HEAD:agent/audit-phase8-housing
