name: Apply phase 13D healer migration

on:
  push:
    branches:
      - agent/audit-phase13d-tavern-healer
    paths:
      - phase13d-healer-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase13d-tavern-healer
          fetch-depth: 1
      - run: node scripts/apply-phase13d-healer.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Migrate Healer UI to canonical service"
          git push origin HEAD:agent/audit-phase13d-tavern-healer
