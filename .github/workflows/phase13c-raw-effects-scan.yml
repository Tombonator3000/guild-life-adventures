name: Phase 13C raw effect scan

on:
  push:
    branches:
      - agent/audit-phase13c-raw-effects
    paths:
      - phase13c-scan-trigger.txt

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase13c-raw-effects
          fetch-depth: 1
      - name: Scan current callers and allowlist
        shell: bash
        run: |
          {
            echo '# Raw time/stat action callers after phase 13B'
            echo
            for name in spendTime modifyGold modifyHealth modifyHappiness modifyFood modifyClothing modifyMaxHealth modifyRelaxation cureSickness; do
              echo "## $name"
              grep -RIn --include='*.ts' --include='*.tsx' -E "\\b${name}\\s*\\(" src \
                | grep -v '/store/helpers/' \
                | grep -v '/test/' \
                | grep -v '\.test\.' || true
              echo
            done
            echo '# Props and selector declarations'
            grep -RIn --include='*.ts' --include='*.tsx' -E '(spendTime|modifyGold|modifyHealth|modifyHappiness|modifyFood|modifyClothing|modifyMaxHealth|modifyRelaxation|cureSickness):' src/components src/hooks || true
            echo
            echo '# Guest allowlist'
            sed -n '125,190p' src/network/types.ts
          } > phase13c-raw-effects-scan.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase13c-raw-effects-scan.txt
          git commit -m "Record phase 13C raw effect scan"
          git push origin HEAD:agent/audit-phase13c-raw-effects
