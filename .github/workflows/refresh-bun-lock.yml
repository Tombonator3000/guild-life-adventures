name: Refresh Bun lockfile

on:
  push:
    branches:
      - agent/phase-16y-release-safety

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Resolve dependencies
        run: bun install
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-bun-lock
          path: bun.lock
          if-no-files-found: error
