name: Refresh Bun lockfile

on:
  push:
    branches:
      - agent/phase-16y-release-safety

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Resolve dependencies
        run: bun install
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Update Bun lockfile for pinned tooling"
          git push
