name: Clean phase 6 temporary files

on:
  push:
    branches:
      - agent/audit-phase6-appliances
    paths:
      - phase6-cleanup-trigger.txt
      - .github/workflows/phase6-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase6-appliances
          fetch-depth: 1
      - name: Remove temporary phase 6 files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch \
            .github/workflows/apply-phase6-appliances.yml \
            .github/workflows/apply-phase6-lint-rename.yml \
            .github/workflows/apply-phase6-test-list.yml \
            .github/workflows/phase6-targeted-tests.yml \
            .github/workflows/phase6-cleanup.yml \
            phase6-appliance-result.txt \
            phase6-appliance-trigger.txt \
            phase6-lint-rename-trigger.txt \
            phase6-test-list-trigger.txt \
            phase6-test-trigger.txt \
            phase6-cleanup-trigger.txt \
            scripts/apply-phase6-appliances.mjs \
            scripts/patch-phase6-appliance-tests.mjs \
            scripts/rename-phase6-appliance-action.mjs \
            validation/phase6-appliance-tests.txt \
            validation/phase6-full-tests.txt \
            validation/phase6-install.txt \
            validation/phase6-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove phase 6 temporary files"
          git push origin HEAD:agent/audit-phase6-appliances
