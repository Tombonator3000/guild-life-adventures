name: Temporary audio placeholder cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-placeholders:
    if: github.head_ref == 'agent/phase-16y-audio-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-16y-audio-cleanup
      - name: Remove measured placeholders and maintain changelog entry
        shell: bash
        run: |
          rm -f \
            public/ambient/academy-ambient.mp3 \
            public/ambient/enchanter-ambient.mp3 \
            public/ambient/fence-ambient.mp3 \
            public/ambient/market-ambient.mp3 \
            public/ambient/noble-ambient.mp3 \
            public/sfx/button-hover.mp3 \
            public/sfx/coin-gain.mp3 \
            public/sfx/coin-spend.mp3 \
            public/sfx/damage-taken.mp3 \
            public/sfx/defeat.mp3 \
            public/sfx/door-open.mp3 \
            public/sfx/festival.mp3 \
            public/sfx/footstep.mp3 \
            public/sfx/gold-button-click.mp3 \
            public/sfx/heal.mp3 \
            public/sfx/item-equip.mp3 \
            public/sfx/quest-accept.mp3 \
            public/sfx/success.mp3 \
            public/sfx/sword-hit.mp3 \
            public/sfx/turn-start.mp3 \
            public/sfx/work-complete.mp3 \
            public/sfx/study.mp3

          python3 <<'PY'
          from pathlib import Path

          path = Path('src/components/screens/ChangelogScreen.tsx')
          content = path.read_text()
          if "version: 'v0.10.3'" not in content:
              marker = "const CHANGELOG: Version[] = [\n"
              block = """  {
            version: 'v0.10.3',
            date: 'July 26, 2026',
            title: 'Phase 16Y: Audited Audio Integrity',
            highlights: [
              improve('Measured every packaged MP3 with FFprobe and FFmpeg instead of assuming that a file extension meant usable audio'),
              fix('Removed 21 invalid files that were identical placeholder payloads across unrelated ambient and sound-effect names'),
              fix('Removed the duplicate Study MP3; Study now uses its distinct procedural sound'),
              improve('Effects without verified files are now intentionally synth-first and no longer request broken or missing MP3 URLs'),
              improve('Five locations use the verified town-street ambient fallback until dedicated audited loops are available'),
              fix('Removed nonexistent music variant references and the missing curse-cast file request'),
              improve('CI now rejects invalid, silent or exact duplicate packaged MP3 files and publishes an audio audit report'),
            ],
          },
          """
              if marker not in content:
                  raise SystemExit('Changelog marker not found')
              content = content.replace(marker, marker + block, 1)
          content = content.replace(
              "fix('Removed the duplicate Study MP3 and now uses its distinct procedural study sound')",
              "fix('Removed the duplicate Study MP3; Study now uses its distinct procedural sound')",
          )
          path.write_text(content)
          PY
      - name: Commit measured cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Measured audio cleanup is already complete."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ambient public/sfx src/components/screens/ChangelogScreen.tsx
          git commit -m "Complete audited audio cleanup"
          git push origin HEAD:agent/phase-16y-audio-cleanup
