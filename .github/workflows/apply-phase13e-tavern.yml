name: Apply phase 13E Tavern integration

on:
  push:
    branches:
      - agent/audit-phase13e-tavern
    paths:
      - phase13e-apply-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase13e-tavern
          fetch-depth: 1
      - name: Apply Tavern integration
        run: node scripts/apply-phase13e-tavern.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate host-authoritative Tavern service"
          git push origin HEAD:agent/audit-phase13e-tavern
