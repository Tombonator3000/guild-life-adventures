name: Apply phase 8 AI rent precheck

on:
  push:
    branches:
      - agent/audit-phase8-housing
    paths:
      - phase8-ai-rent-trigger.txt
      - .github/workflows/apply-phase8-ai-rent.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase8-housing
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: node scripts/patch-phase8-ai-rent.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/ai/actions/criticalNeeds.ts
          git commit -m "Align AI rent checks with market pricing" || true
          git push origin HEAD:agent/audit-phase8-housing
