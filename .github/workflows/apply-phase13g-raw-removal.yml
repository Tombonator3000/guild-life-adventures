name: Apply phase 13G raw guest action removal

on:
  push:
    branches:
      - agent/audit-phase13g-remaining-raw
    paths:
      - phase13g-apply-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase13g-remaining-raw
          fetch-depth: 1
      - name: Apply semantic service migration
        run: node scripts/apply-phase13g-raw-removal.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove raw stat and time actions from guest protocol"
          git push origin HEAD:agent/audit-phase13g-remaining-raw
