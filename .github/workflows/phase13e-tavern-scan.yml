name: Phase 13E Tavern state scan

on:
  push:
    branches:
      - agent/audit-phase13e-tavern
    paths:
      - phase13e-scan-trigger.txt

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase13e-tavern
          fetch-depth: 1
      - name: Find player creation, migration and reset paths
        shell: bash
        run: |
          {
            echo '# TAVERN ITEMS'
            grep -RIn --include='*.ts' 'TAVERN_ITEMS' src || true
            echo
            echo '# PLAYER CREATION'
            grep -RIn --include='*.ts' --include='*.tsx' -E '(createPlayer|foodBoughtWithoutPreservation:|raiseAttemptedThisTurn:)' src || true
            echo
            echo '# TURN RESET'
            grep -RIn --include='*.ts' -E '(raiseAttemptedThisTurn|hadRandomEventThisTurn|dungeonAttemptsThisTurn).*(:|=)' src/store || true
            echo
            echo '# SAVE MIGRATION'
            grep -RIn --include='*.ts' -E '(saveVersion|migrat|version.*save|prepaidDegrees|pawnedAppliances)' src/data src/store || true
            echo
            echo '# TAVERN CALLERS'
            grep -RIn --include='*.ts' --include='*.tsx' -E '(TavernPanel|setEventMessage|modifyFood|modifyHappiness|modifyHealth)' src/components/game/locationTabs.tsx src/components/game/LocationPanel.tsx || true
          } > phase13e-tavern-scan.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase13e-tavern-scan.txt
          git commit -m "Record Tavern state integration scan"
          git push origin HEAD:agent/audit-phase13e-tavern
