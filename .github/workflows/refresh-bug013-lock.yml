name: Refresh BUG-013 Bun lock

on:
  push:
    branches:
      - agent/phase-16y-bug-013
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event_name == 'push' || github.head_ref == 'agent/phase-16y-bug-013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Align workspace metadata
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          package_name = json.loads(Path('package.json').read_text())['name']
          path = Path('bun.lock')
          content = path.read_text()
          old = '"name": "vite_react_shadcn_ts"'
          new = f'"name": "{package_name}"'
          if old in content:
              path.write_text(content.replace(old, new, 1))
          elif new not in content:
              raise SystemExit('Could not find expected Bun workspace name')
          PY
      - name: Verify dependency graph
        run: bun install --frozen-lockfile
      - name: Commit lockfile metadata
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Align Bun lock workspace metadata"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
