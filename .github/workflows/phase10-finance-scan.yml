name: Phase 10 finance scan

on:
  push:
    branches:
      - agent/audit-phase10-finance
    paths:
      - phase10-finance-scan-trigger.txt
      - .github/workflows/phase10-finance-scan.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase10-finance
          fetch-depth: 1
      - name: Scan finance actions
        shell: bash
        run: |
          set +e
          {
            echo '# Definitions and callers'
            grep -RIn --include='*.ts' --include='*.tsx' -E '\b(depositToBank|withdrawFromBank|invest|withdrawInvestment|buyStock|sellStock|takeLoan|repayLoan)\b' src || true
            echo
            echo '# Finance-related files'
            find src -type f \( -iname '*bank*' -o -iname '*stock*' -o -iname '*loan*' -o -iname '*invest*' -o -iname '*finance*' \) -print | sort
            echo
            echo '# Numeric protocol rules'
            grep -RIn --include='*.ts' -E '(depositToBank|withdrawFromBank|invest|withdrawInvestment|buyStock|sellStock|takeLoan|repayLoan)' src/network || true
            echo
            echo '# AI finance action details'
            grep -RIn --include='*.ts' -E "type: '(deposit|withdraw|invest|withdraw-investment|buy-stock|sell-stock|take-loan|repay-loan)'|details:.*(amount|shares|stockId)" src/hooks/ai || true
          } > phase10-finance-scan.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase10-finance-scan.txt
          git commit -m "Record phase 10 finance scan" || true
          git push origin HEAD:agent/audit-phase10-finance
