name: Phase 3 self validation

on:
  push:
    branches:
      - agent/remaining-audit-final
    paths:
      - validation-trigger.txt
      - .github/workflows/phase3-self-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remaining-audit-final
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run validation and publish result
        shell: bash
        run: |
          set +e
          mkdir -p validation

          bun install --frozen-lockfile > validation/install.log 2>&1
          install_status=$?

          if [ "$install_status" -eq 0 ]; then
            bunx tsc --noEmit > validation/typescript.log 2>&1
            type_status=$?
            bunx vitest run > validation/tests.log 2>&1
            test_status=$?
            bun run build > validation/build.log 2>&1
            build_status=$?
            bun run lint > validation/lint.log 2>&1
            lint_status=$?
            bun add --dev --no-save @playwright/test > validation/playwright-install.log 2>&1
            runner_status=$?
            if [ "$runner_status" -eq 0 ]; then
              bunx playwright install --with-deps --only-shell chromium >> validation/playwright-install.log 2>&1
              browser_status=$?
            else
              browser_status=99
            fi
            if [ "$runner_status" -eq 0 ] && [ "$browser_status" -eq 0 ]; then
              bunx playwright test > validation/playwright.log 2>&1
              playwright_status=$?
            else
              playwright_status=99
            fi
          else
            type_status=99
            test_status=99
            build_status=99
            lint_status=99
            runner_status=99
            browser_status=99
            playwright_status=99
          fi

          cat > validation/phase3-result.txt <<EOF
          validated_sha=$(git rev-parse HEAD)
          install=$install_status
          typescript=$type_status
          tests=$test_status
          build=$build_status
          lint=$lint_status
          playwright_runner=$runner_status
          playwright_browser=$browser_status
          playwright=$playwright_status
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation
          git commit -m "Record phase 3 validation results" || true
          git push origin HEAD:agent/remaining-audit-final

          if [ "$install_status" -ne 0 ] || [ "$type_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ] || [ "$lint_status" -ne 0 ] || [ "$runner_status" -ne 0 ] || [ "$browser_status" -ne 0 ] || [ "$playwright_status" -ne 0 ]; then
            exit 1
          fi
