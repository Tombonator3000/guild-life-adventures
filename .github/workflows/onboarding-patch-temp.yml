name: Temporary guided onboarding integration

on:
  push:
    branches:
      - agent/phase-16y-interactive-onboarding
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-onboarding:
    if: github.event_name == 'push' || github.head_ref == 'agent/phase-16y-interactive-onboarding'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-16y-interactive-onboarding
      - name: Add integration targets and restart control
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          tutorial = Path('src/components/game/TutorialOverlay.tsx')
          content = tutorial.read_text()
          old = '''function findVisibleTarget(selector?: string): HTMLElement | null {
            if (selector) {
              const target = document.querySelector<HTMLElement>(selector);
              if (target && target.getBoundingClientRect().width > 0 && target.getBoundingClientRect().height > 0) return target;
            }

            if (selector === '[data-tutorial-target="end-turn"]') {
              const buttons = [...document.querySelectorAll<HTMLButtonElement>('button')];
              return buttons.find(button => {
                const rect = button.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0 && /end turn/i.test(button.textContent ?? '');
              }) ?? null;
            }

            return null;
          }'''
          new = '''function findVisibleTarget(selector?: string): HTMLElement | null {
            if (selector) {
              const target = document.querySelector<HTMLElement>(selector);
              if (target && target.getBoundingClientRect().width > 0 && target.getBoundingClientRect().height > 0) return target;
            }

            const fallbackMatchers: Record<string, RegExp> = {
              '[data-tutorial-target="employment-panel"]': /guild hall|floor sweeper|accept job|apply/i,
              '[data-tutorial-target="work-shift"]': /work shift/i,
              '[data-tutorial-target="food-panel"]': /loaf of bread|wheel of cheese/i,
              '[data-tutorial-target="bank-deposit"]': /deposit 50/i,
              '[data-tutorial-target="end-turn"]': /end turn/i,
            };
            const matcher = selector ? fallbackMatchers[selector] : undefined;
            if (!matcher) return null;

            const buttons = [...document.querySelectorAll<HTMLButtonElement>('button')];
            return buttons.find(button => {
              const rect = button.getBoundingClientRect();
              return rect.width > 0 && rect.height > 0 && matcher.test(button.textContent ?? '');
            }) ?? null;
          }'''
          if old in content:
              content = content.replace(old, new, 1)
          elif 'const fallbackMatchers: Record<string, RegExp>' not in content:
              raise SystemExit('Tutorial target resolver marker not found')
          tutorial.write_text(content)

          shell = Path('src/components/game/LocationShell.tsx')
          content = shell.read_text()
          old = '''          <button
            onClick={workInfo.onWork}'''
          new = '''          <button
            data-tutorial-target="work-shift"
            onClick={workInfo.onWork}'''
          if 'data-tutorial-target="work-shift"' not in content:
              if old not in content:
                  raise SystemExit('Work button marker not found')
              content = content.replace(old, new, 1)
          shell.write_text(content)

          options = Path('src/components/game/OptionsMenu.tsx')
          content = options.read_text()
          state_marker = '''  const { t, language, setLanguage } = useTranslation();
'''
          state_addition = '''  const { t, language, setLanguage } = useTranslation();
  const gamePhase = useGameStore(state => state.phase);
  const setShowTutorial = useGameStore(state => state.setShowTutorial);
  const setTutorialStep = useGameStore(state => state.setTutorialStep);

  const restartGuidedTutorial = () => {
    setTutorialStep(0);
    setShowTutorial(true);
    onClose();
  };
'''
          if 'const restartGuidedTutorial' not in content:
              if state_marker not in content:
                  raise SystemExit('Options state marker not found')
              content = content.replace(state_marker, state_addition, 1)

          footer_marker = '''        <div className="px-6 py-3 border-t border-border space-y-2">
          {/* Manual Button */}'''
          footer_addition = '''        <div className="px-6 py-3 border-t border-border space-y-2">
          {gamePhase === 'playing' && (
            <button
              onClick={restartGuidedTutorial}
              className="w-full flex items-center justify-center gap-2 p-2 rounded border border-amber-700/50 bg-amber-100/40 text-amber-900 hover:bg-amber-100/70 font-display text-sm transition-colors"
            >
              <BookOpen className="w-4 h-4" /> Restart Guided First Turn
            </button>
          )}
          {/* Manual Button */}'''
          if 'Restart Guided First Turn' not in content:
              if footer_marker not in content:
                  raise SystemExit('Options footer marker not found')
              content = content.replace(footer_marker, footer_addition, 1)
          options.write_text(content)
          PY
      - name: Commit integration patches
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Onboarding integration is already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/game/TutorialOverlay.tsx src/components/game/LocationShell.tsx src/components/game/OptionsMenu.tsx
          git commit -m "Integrate guided onboarding with live controls"
          git push origin HEAD:agent/phase-16y-interactive-onboarding
