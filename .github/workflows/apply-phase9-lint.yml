name: Finalize phase 9 through proven workflow

on:
  push:
    branches:
      - agent/audit-phase9-hex
    paths:
      - phase9-lint-trigger.txt
      - .github/workflows/apply-phase9-lint.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase9-hex
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Finalize source tree
        run: node scripts/finalize-phase9.mjs
      - name: Commit final source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize phase 9 hex audit" || true
          git push origin HEAD:agent/audit-phase9-hex
