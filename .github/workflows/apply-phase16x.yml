name: Generate Phase 16X Files

on:
  push:
    branches:
      - agent/phase16x-broker-newspaper
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase16x-broker-newspaper

      - name: Apply transformation in temporary checkout
        run: python scripts/apply_phase16x.py

      - name: Collect generated files
        run: |
          mkdir -p phase16x-generated
          git diff --name-only --diff-filter=ACM | while read file; do
            mkdir -p "phase16x-generated/$(dirname "$file")"
            cp "$file" "phase16x-generated/$file"
          done
          git diff > phase16x-generated/phase16x.patch

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: phase16x-generated-files
          path: phase16x-generated
          if-no-files-found: error
