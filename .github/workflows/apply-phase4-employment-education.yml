name: Apply phase 4 employment education patch

on:
  push:
    branches:
      - agent/audit-phase4
    paths:
      - phase4-employment-education-trigger.txt
      - .github/workflows/apply-phase4-employment-education.yml
      - scripts/apply-phase4-employment-education.mjs
      - scripts/patch-phase4-academy.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase4
          fetch-depth: 1
      - name: Apply source patches and record result
        shell: bash
        run: |
          set +e
          node scripts/apply-phase4-employment-education.mjs > phase4-patch-result.txt 2>&1
          status=$?

          if [ "$status" -ne 0 ] && grep -q "AcademyPanel.tsx: standard class click" phase4-patch-result.txt; then
            echo "Applying Academy fallback patch" >> phase4-patch-result.txt
            node scripts/patch-phase4-academy.mjs >> phase4-patch-result.txt 2>&1
            status=$?
          fi

          echo "status=$status" >> phase4-patch-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4-patch-result.txt
          if [ "$status" -eq 0 ]; then
            git add src/store/storeTypes.ts src/store/gameStore.ts src/network/types.ts src/components/game/LocationPanel.tsx src/components/game/locationTabs.tsx src/components/game/WorkSection.tsx src/components/game/AcademyPanel.tsx
          fi
          git commit -m "Record phase 4 employment education patch result" || true
          git push origin HEAD:agent/audit-phase4
          exit "$status"
