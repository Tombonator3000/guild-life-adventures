name: Scan remaining raw guest callers

on:
  push:
    branches:
      - agent/audit-phase13g-remaining-raw
    paths:
      - phase13g-scan-trigger.txt

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase13g-remaining-raw
          fetch-depth: 1
      - name: Scan UI and AI callers
        shell: bash
        run: |
          {
            echo '# Remaining raw action callers after phase 13F'
            echo
            for action in spendTime modifyGold modifyHealth modifyHappiness modifyFood modifyClothing modifyMaxHealth modifyRelaxation; do
              echo "## $action"
              rg -n --glob 'src/**/*.{ts,tsx}' --glob '!src/store/**' --glob '!src/test/**' --glob '!src/network/**' "\\b${action}\\s*\\(" || true
              echo
            done
            echo '# Remaining raw actions in guest allowlist'
            sed -n '/export const ALLOWED_GUEST_ACTIONS/,/]);/p' src/network/types.ts
          } > phase13g-raw-scan.txt
      - name: Commit scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase13g-raw-scan.txt
          git commit -m "Record remaining raw guest action scan"
          git push origin HEAD:agent/audit-phase13g-remaining-raw
