name: Finalize phase 10 through proven workflow

on:
  push:
    branches:
      - agent/audit-phase10-finance
    paths:
      - phase10-validation-trigger.txt
      - .github/workflows/phase10-full-validation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase10-finance
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Finalize validated branch
        run: node scripts/finalize-phase10.mjs
      - name: Commit final source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize phase 10 finance audit" || true
          git push origin HEAD:agent/audit-phase10-finance
