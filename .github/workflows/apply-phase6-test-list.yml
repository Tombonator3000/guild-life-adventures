name: Apply phase 6 appliance test list

on:
  push:
    branches:
      - agent/audit-phase6-appliances
    paths:
      - phase6-test-list-trigger.txt
      - .github/workflows/apply-phase6-test-list.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase6-appliances
          fetch-depth: 1
      - run: node scripts/patch-phase6-appliance-tests.mjs
      - name: Commit test update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/multiplayer.test.ts
          git commit -m "Update appliance actions in cross-player test"
          git push origin HEAD:agent/audit-phase6-appliances
