name: Apply phase 13F dungeon integration

on:
  push:
    branches:
      - agent/audit-phase13f-dungeon
    paths:
      - phase13f-apply-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase13f-dungeon
          fetch-depth: 1
      - name: Apply dungeon integration
        run: node scripts/apply-phase13f-dungeon.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate host-authoritative dungeon sessions"
          git push origin HEAD:agent/audit-phase13f-dungeon
