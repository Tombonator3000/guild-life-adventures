name: Apply phase 16C GameBoard center panel

on:
  push:
    branches:
      - agent/audit-phase16c-gameboard-center
    paths:
      - phase16c-apply-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase16c-gameboard-center
          fetch-depth: 1
      - name: Apply center panel extraction
        run: node scripts/apply-phase16c-gameboard-center.mjs
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract GameBoard center panel"
          git push origin HEAD:agent/audit-phase16c-gameboard-center
