name: Update phase 13B final audit note

on:
  push:
    branches:
      - agent/audit-phase13b-travel
    paths:
      - phase13b-audit-trigger.txt

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase13b-travel
          fetch-depth: 1
      - name: Record deterministic E2E stabilization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/AUDIT_LOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '- En for bred mellomoppdatering av `multiplayer.test.ts` ble oppdaget av CI. Originalfilen ble gjenopprettet fra `main`, og bare de to nødvendige reiseforventningene ble påført.'
          addition = marker + '\n- Playwrights første sluttforsøk avdekket testflakiness: en tilfeldig Shadowfingers-hendelse kunne stjele alt gull på bankreisen og skjule banktjenestene. E2E-testen fryser nå sannsynlighetskast før appstart, slik at den tester bank/save/load-flyten deterministisk uten å slå av hendelser i produktkoden.'
          if marker not in text:
              raise SystemExit('Phase 13B marker not found')
          if 'E2E-testen fryser nå sannsynlighetskast' not in text:
              text = text.replace(marker, addition)

          test_marker = '  - Title/setup-smoke og komplett lokal spillflyt: bestått.'
          final_note = test_marker + '\n- Ren PR-validering etter deterministic E2E-retting og artefaktrydding: GitHub Actions-run `30052428663`, alle steg bestått uten retry-artefakter.'
          if 'GitHub Actions-run `30052428663`' not in text:
              text = text.replace(test_marker, final_note, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/update-phase13b-audit.yml phase13b-audit-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record deterministic phase 13B E2E validation"
          git push origin HEAD:agent/audit-phase13b-travel
