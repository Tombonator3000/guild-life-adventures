name: Apply phase 7 inventory migration

on:
  push:
    branches:
      - agent/audit-phase7-inventory
    paths:
      - phase7-inventory-trigger.txt
      - .github/workflows/apply-phase7-inventory.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase7-inventory
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply migration
        run: node scripts/apply-phase7-inventory.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs
          git commit -m "Migrate inventory sales to host intent" || true
          git push origin HEAD:agent/audit-phase7-inventory
