name: Apply phase 3 patches

on:
  push:
    branches:
      - agent/remaining-audit-phase3
    paths:
      - scripts/apply-phase3-patches.mjs
      - .github/workflows/apply-phase3-patches.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remaining-audit-phase3
      - name: Apply exact source patches
        run: node scripts/apply-phase3-patches.mjs
      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useGrimwaldAI.ts src/hooks/useZoneEditorState.ts src/components/game/GameBoard.tsx src/network/useNetworkSync.ts
          git diff --cached --quiet && exit 0
          git commit -m "Apply AI, selector, editor and network validation fixes"
          git push origin HEAD:agent/remaining-audit-phase3
