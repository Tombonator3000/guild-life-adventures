name: Apply phase 5 vendor patch

on:
  push:
    branches:
      - agent/audit-phase5
    paths:
      - phase5-vendor-trigger.txt
      - .github/workflows/apply-phase5-vendor.yml
      - scripts/apply-phase5-vendor.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase5
          fetch-depth: 1
      - name: Apply vendor migration and publish result
        shell: bash
        run: |
          set +e
          node scripts/apply-phase5-vendor.mjs > phase5-vendor-result.txt 2>&1
          status=$?
          echo "status=$status" >> phase5-vendor-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase5-vendor-result.txt
          if [ "$status" -eq 0 ]; then
            git add src/store/helpers/economyHelpers.ts src/store/storeTypes.ts src/network/types.ts src/components/game/LocationPanel.tsx src/components/game/locationTabs.tsx src/components/game/ShadowMarketPanel.tsx src/test/multiplayer.test.ts
          fi
          git commit -m "Record phase 5 vendor migration result" || true
          git push origin HEAD:agent/audit-phase5
          exit "$status"
