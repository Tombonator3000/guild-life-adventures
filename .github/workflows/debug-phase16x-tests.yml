name: Phase 16X Test Diagnostics

on:
  push:
    branches:
      - agent/phase16x-broker-newspaper
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply isolated expectation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          multiplayer = Path('src/test/multiplayer.test.ts')
          text = multiplayer.read_text()
          text = text.replace(
              "expect(ALLOWED_GUEST_ACTIONS.has('manageInvestment')).toBe(true);",
              "expect(ALLOWED_GUEST_ACTIONS.has('manageInvestment')).toBe(false);",
              1,
          )
          text = text.replace(
              "'prepayDegree', 'graduateDegree', 'transferBankFunds', 'manageInvestment',",
              "'prepayDegree', 'graduateDegree', 'transferBankFunds',",
              1,
          )
          multiplayer.write_text(text)

          newspaper = Path('src/components/game/GeneralStorePanel.test.tsx')
          text = newspaper.read_text().replace(
              "fireEvent.click(screen.getByRole('button', { name: 'Close' }));",
              "fireEvent.click(screen.getAllByRole('button', { name: 'Close' })[0]);",
              1,
          )
          newspaper.write_text(text)
          PY

      - name: Collect corrected files
        run: |
          mkdir -p corrected/src/test corrected/src/components/game
          cp src/test/multiplayer.test.ts corrected/src/test/multiplayer.test.ts
          cp src/components/game/GeneralStorePanel.test.tsx corrected/src/components/game/GeneralStorePanel.test.tsx

      - name: Run Vitest with complete output
        id: tests
        shell: bash
        run: |
          set +e
          bunx vitest run > phase16x-test-output.txt 2>&1
          status=$?
          cat phase16x-test-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload corrected files and test output
        uses: actions/upload-artifact@v4
        with:
          name: phase16x-corrected-tests
          path: |
            corrected
            phase16x-test-output.txt
          if-no-files-found: error

      - name: Preserve test result
        if: steps.tests.outputs.status != '0'
        run: exit 1
