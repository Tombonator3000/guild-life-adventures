name: Agent validation

on:
  workflow_call:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Enforce lockfile policy
        shell: bash
        run: |
          test -f bun.lock
          test ! -e bun.lockb
          test "$(bun --version)" = "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run check:types

      - name: Unit tests
        id: unit_tests
        shell: bash
        run: |
          set +e
          bun run test 2>&1 | tee vitest-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload unit test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-output
          path: vitest-output.txt
          if-no-files-found: error

      - name: Production build
        run: bun run build

      - name: ESLint
        id: lint
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee lint-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload lint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint-output.txt
          if-no-files-found: error

      - name: Install audio analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Audio asset integrity
        run: node scripts/audit-audio.mjs --json audio-audit/audio-audit.json --markdown audio-audit/audio-audit.md --fail-on-silent --fail-on-duplicates

      - name: Upload audio audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-audit
          path: audio-audit
          if-no-files-found: ignore

      - name: Install Chromium headless shell
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Browser smoke tests
        run: bun run test:e2e

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
