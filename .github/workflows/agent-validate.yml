name: Agent validation

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Unit tests
        id: unit_tests
        shell: bash
        run: |
          set +e
          bunx vitest run 2>&1 | tee vitest-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload unit test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-output
          path: vitest-output.txt
          if-no-files-found: error
      - name: Production build
        run: bun run build
      - name: ESLint
        id: lint
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee lint-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload lint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint-output.txt
          if-no-files-found: error
      - name: Install Playwright runner
        run: bun add --dev --no-save @playwright/test
      - name: Install Chromium headless shell
        run: bunx playwright install --with-deps --only-shell chromium
      - name: Browser smoke tests
        run: bunx playwright test
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
