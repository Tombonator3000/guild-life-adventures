name: Agent validation

on:
  push:
    branches:
      - agent/complete-priority-fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bunx vitest run
      - name: Production build
        run: bun run build
      - name: ESLint
        run: bun run lint
