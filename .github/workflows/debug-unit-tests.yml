name: Debug unit tests

on:
  pull_request:
    branches: [main]

jobs:
  capture-unit-test-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Capture Vitest output
        run: |
          set +e
          bun run test > unit-test-output.txt 2>&1
          echo $? > unit-test-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-debug
          path: |
            unit-test-output.txt
            unit-test-exit-code.txt
          retention-days: 1
