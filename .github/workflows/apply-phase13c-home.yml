name: Apply phase 13C home migration

on:
  push:
    branches:
      - agent/audit-phase13c-raw-effects
    paths:
      - phase13c-home-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase13c-raw-effects
          fetch-depth: 1
      - run: node scripts/apply-phase13c-home.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Migrate home recovery to host action"
          git push origin HEAD:agent/audit-phase13c-raw-effects
