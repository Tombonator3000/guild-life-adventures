name: Apply phase 6B equipment patch

on:
  push:
    branches:
      - agent/audit-phase6-equipment
    paths:
      - phase6-equipment-trigger.txt
      - .github/workflows/apply-phase6-equipment.yml
      - scripts/apply-phase6-equipment.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase6-equipment
          fetch-depth: 1
      - name: Apply equipment migration and publish result
        shell: bash
        run: |
          set +e
          node scripts/apply-phase6-equipment.mjs > phase6-equipment-result.txt 2>&1
          status=$?
          echo "status=$status" >> phase6-equipment-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase6-equipment-result.txt
          if [ "$status" -eq 0 ]; then
            git add src/store/helpers/economyHelpers.ts src/store/storeTypes.ts src/network/types.ts src/components/game/ArmoryPanel.tsx src/components/game/PawnShopPanel.tsx src/components/game/ForgePanel.tsx src/components/game/locationTabs.tsx src/components/game/LocationPanel.tsx src/test/multiplayer.test.ts
          fi
          git commit -m "Record phase 6B equipment migration result" || true
          git push origin HEAD:agent/audit-phase6-equipment
          exit "$status"
