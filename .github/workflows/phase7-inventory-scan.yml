name: Phase 7 inventory call scan

on:
  push:
    branches:
      - agent/audit-phase7-inventory
    paths:
      - phase7-inventory-scan-trigger.txt
      - .github/workflows/phase7-inventory-scan.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase7-inventory
          fetch-depth: 1
      - name: Scan inventory action callers
        shell: bash
        run: |
          set +e
          {
            echo '# buyItem callers'
            grep -RIn --include='*.ts' --include='*.tsx' -E '\bbuyItem\s*\(' src || true
            echo
            echo '# sellItem callers'
            grep -RIn --include='*.ts' --include='*.tsx' -E '\bsellItem\s*\(' src || true
            echo
            echo '# buyDurable callers'
            grep -RIn --include='*.ts' --include='*.tsx' -E '\bbuyDurable\s*\(' src || true
            echo
            echo '# sellDurable callers'
            grep -RIn --include='*.ts' --include='*.tsx' -E '\bsellDurable\s*\(' src || true
            echo
            echo '# inventory mutations and reads'
            grep -RIn --include='*.ts' --include='*.tsx' -E 'inventory|sellPrice|getSellPrice' src/components src/hooks src/store | head -n 500 || true
          } > phase7-inventory-scan.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase7-inventory-scan.txt
          git commit -m "Record phase 7 inventory call scan" || true
          git push origin HEAD:agent/audit-phase7-inventory
