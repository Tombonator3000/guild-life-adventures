name: Apply phase 12 protocol patch

on:
  push:
    branches:
      - agent/audit-phase12-protocol-security
    paths:
      - phase12-protocol-trigger.txt
      - .github/workflows/apply-phase12-protocol.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-phase12-protocol-security
          fetch-depth: 1
      - run: node scripts/apply-phase12-protocol.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/network/actionValidation.ts src/network/useNetworkSync.ts src/network/networkState.ts
          git commit -m "Use shared host protocol validation" || true
          git push origin HEAD:agent/audit-phase12-protocol-security
