# Deploy Guild Life Adventures to GitHub Pages only after the same validation
# suite used by pull requests has passed on the exact commit being released.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/agent-validate.yml

  deploy-partykit:
    name: Deploy PartyKit
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}
    steps:
      - name: Check PartyKit credentials
        id: credentials
        shell: bash
        env:
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
        run: |
          if [[ -n "$PARTYKIT_LOGIN" && -n "$PARTYKIT_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$PARTYKIT_LOGIN" && -z "$PARTYKIT_TOKEN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PartyKit credentials are not configured; server deployment is intentionally skipped."
            exit 0
          fi
          echo "::error::PartyKit is partially configured. Both PARTYKIT_LOGIN and PARTYKIT_TOKEN are required."
          exit 1

      - name: Checkout
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Bun
        if: steps.credentials.outputs.configured == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: bun install --frozen-lockfile

      - name: Deploy PartyKit server to Cloudflare
        if: steps.credentials.outputs.configured == 'true'
        run: bunx partykit deploy
        env:
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}

  build:
    name: Build GitHub Pages
    needs: [validate, deploy-partykit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for GitHub Pages
        run: bun run build:github
        env:
          VITE_PARTYKIT_HOST: ${{ secrets.VITE_PARTYKIT_HOST }}

      - name: Copy index.html as 404.html
        run: cp dist/index.html dist/404.html

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke-test:
    name: Verify published site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTML and deployment marker
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          base_url="${PAGE_URL%/}"
          curl --fail --location --retry 8 --retry-delay 5 "$base_url/" --output page.html
          grep -qi "Guild Life" page.html
          curl --fail --location --retry 8 --retry-delay 5 "$base_url/version.json" --output version.json
          grep -q '"buildTime"' version.json
